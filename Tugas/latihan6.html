    <script>
        let angka = window.prompt("Masukkan Angka: ");

        if (angka < 2) {
            alert("Bukan Bilangan Prima");

            document.write(`
                <main class="main-content">
                    <div class="hasil-card error-card">
                        <h1>Bukan Bilangan Prima</h1>
                        <p>Angka yang dimasukkan adalah <strong>${angka}</strong>.</p>
                    </div>
                </main>
            `);

        } else {
            document.write(`
                <main class="main-content">
                    <div class="hasil-card">
                        <h1>Bilangan Prima</h1>
                        <p class="deskripsi">Bilangan prima dari 1 sampai <strong>${angka}</strong></p>
                        <div class="angka-container">
            `);

            for (let i = 2; i <= angka; i++) {
                let prima = true;

                for (let j = 2; j <= Math.sqrt(i); j++) {
                    if (i % j === 0) {
                        prima = false;
                        break;
                    }
                }

                if (prima) {
                    document.write("<span class='angka'>" + i + "</span>");
                }
            }

            document.write(`
                        </div>
                    </div>
                </main>
            `);
        }
    </script>
