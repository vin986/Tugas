    <script>
        function getGrade(nilai) {
            if (nilai >= 85) {
                return "A";
            } else if (nilai >= 80) {
                return "A-";
            } else if (nilai >= 75) {
                return "B+";
            } else if (nilai >= 70) {
                return "B";
            } else if (nilai >= 65) {
                return "B-";
            } else if (nilai >= 60) {
                return "C+";
            } else if (nilai >= 55) {
                return "C";
            } else if (nilai >= 45) {
                return "D";
            } else {
                return "E";
            }
        }

        function hitungNilaiAkhir(a, b, c) {
            return (a * 0.4) + (b * 0.25) + (c * 0.35);
        }

        let jumlahMhs = window.prompt("Jumlah");

        for (let i = 1; i <= jumlahMhs; i++) {
            console.log('test');

            let nama = window.prompt('Nama');
            let tugas = parseFloat(window.prompt('Tugas'));
            let uts = parseFloat(window.prompt('UTS'));
            let uas = parseFloat(window.prompt('UAS'));

            let nilaiAkhir = hitungNilaiAkhir(tugas, uts, uas);
            let grade = getGrade(nilaiAkhir.toFixed(2));

            document.write("<div class='hasil-card'>");
            document.write("<div class='nomor'>" + i + "</div>");
            document.write("<h2>" + nama + "</h2>");
            document.write("<p><span>Tugas</span><strong>" + tugas + "</strong></p>");
            document.write("<p><span>UTS</span><strong>" + uts + "</strong></p>");
            document.write("<p><span>UAS</span><strong>" + uas + "</strong></p>");
            document.write("<div class='nilai-akhir'>");
            document.write("<span>Nilai Akhir</span>");
            document.write("<strong>" + nilaiAkhir + "</strong>");
            document.write("</div>");
            document.write("<div class='grade'>" + grade + "</div>");
            document.write("</div>");
        }
    </script>
