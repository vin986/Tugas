    <script>
            function getGrade(nilai) {
                if (nilai >= 85) {
                    return "A";
                } else if (nilai >= 80) {
                    return "A-";
                } else if (nilai >= 75) {
                    return "B+";
                } else if (nilai >= 70) {
                    return "B";
                } else if (nilai >= 65) {
                    return "B-";
                } else if (nilai >= 60) {
                    return "C+";
                } else if (nilai >= 55) {
                    return "C";
                } else if (nilai >= 45) {
                    return "D";
                } else {
                    return "E";
                }
            }

            function hitungNilaiAkhir(a, b, c) {
                return (a * 0.4) + (b * 0.25) + (c * 0.35);
            }

            jumlahMhs = window.prompt("Jumlah");
            for (i = 1; i <= jumlahMhs; i++) {
                console.log('test');
                nama = window.prompt('Nama');
                tugas = parseFloat(window.prompt('Tugas'));
                uts = parseFloat(window.prompt('UTS'));
                uas = parseFloat(window.prompt('UAS'));

                let nilaiAkhir = hitungNilaiAkhir(tugas, uts, uas);
                let grade = getGrade(nilaiAkhir.toFixed(2));

                document.write("<br /><br />" + i + ". " + nama + "<br />");
                document.write("Tugas: " + tugas);
                document.write("<br />UTS: " + uts);
                document.write("<br />UAS: " + uas);
                document.write("<br />Nilai Akhir: " + nilaiAkhir);
                document.write("<br />Grade: " + grade);
            }
        </script>
        
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
