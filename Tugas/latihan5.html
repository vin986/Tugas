    <script>
        let angka = window.prompt("Masukkan angka: ");

        document.write(`
            <main class="main-content">
                <div class="hasil-card">
                    <h1>Bilangan Ganjil</h1>
                    <p class="deskripsi">Bilangan ganjil dari 1 sampai ${angka}</p>

                    <div class="angka-container">
        `);

        for (let i = 1; i <= angka; i++) {
            if (i % 2 == 1) {
                document.write("<span class='angka'>" + i + "</span>");
            }
        }

        document.write(`
                    </div>
                </div>
            </main>
        `);
    </script>
